{% extends "layout_panel.html" %}
{% block title %}{{ 'Edit user' if editing else 'Add user' }}{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('admin.users') }}">← Back to users</a>
<h1 class="h-page">{{ 'Edit user' if editing else 'Add user' }}</h1>
<form class="card form-card stack" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if editing %}
  <label class="field">ID
    <input class="input" value="{{ data.id_user }}" readonly>
  </label>
  {% endif %}
  <label class="field">Name
    <input class="input" name="name" value="{{ data.name }}" required maxlength="80">
  </label>
  <label class="field">Email
    <input class="input" name="email" type="email" value="{{ data.email }}" required maxlength="120">
  </label>
  <label class="field">Role
    <select class="select" name="role">
      {% for r in roles %}<option value="{{ r }}" {% if data.role == r %}selected{% endif %}>{{ r|capitalize }}</option>{% endfor %}
    </select>
  </label>
  {% if not editing %}
  <label class="field">Temporary password <span class="muted">(optional)</span>
    <input class="input" name="temp_password" type="password" autocomplete="new-password" maxlength="128">
    <span class="hint">Without it the account exists but cannot sign in. Share it privately and ask the user to change it.</span>
  </label>
  {% endif %}
  <div class="actions-row actions-row--end">
    <a class="btn btn--outline" href="{{ url_for('admin.users') }}">Cancel</a>
    <button type="submit" class="btn btn--primary">{{ 'Save changes' if editing else 'Add user' }}</button>
  </div>
</form>
{% endblock %}
