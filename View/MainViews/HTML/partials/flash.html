{% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-stack">
    {% for category, text in messages %}
      <p class="alert alert--{{ category }}" role="{{ 'alert' if category == 'error' else 'status' }}">{{ text }}</p>
    {% endfor %}
  </div>
  {% endif %}
{% endwith %}
